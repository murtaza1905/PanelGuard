name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (universal, ad-hoc signed)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          xcrun swiftc --version

      - name: Build
        run: ./scripts/build.sh

      - name: Verify bundle
        run: |
          app="build/PanelGuard.app"
          lipo -archs "$app/Contents/MacOS/PanelGuard" | grep -q "x86_64 arm64"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist"
          test -f "$app/Contents/Resources/PrivacyInfo.xcprivacy"
          codesign --verify --verbose=2 "$app"

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: PanelGuard-ci
          path: build/PanelGuard.app
